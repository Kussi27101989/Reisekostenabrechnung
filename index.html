<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#004431">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reisekosten">
<meta name="format-detection" content="telephone=no">
<title>Reisekosten RB003</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">

</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn" id="mPrev" aria-label="Vorheriger Monat">‹</button>
    <div class="month-title">
      <div id="mLabel">–</div>
      <div class="sub" id="mTotal">0,00 €</div>
    </div>
    <button class="icon-btn" id="mNext" aria-label="Nächster Monat">›</button>
  </header>

  <nav class="tabs" id="tabs">
    <button data-view="overview" class="active"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></svg><span>Übersicht</span></button>
    <button data-view="receipts"><svg viewBox="0 0 24 24"><path d="M6 2.5h12v19l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4-2 1.4z"/><path d="M9 7.5h6M9 11h6M9 14.5h4"/></svg><span>Belege</span></button>
    <button data-view="days"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg><span>Reisetage</span></button>
    <button data-view="vehicle"><svg viewBox="0 0 24 24"><path d="M4 16.5V12l2-5h12l2 5v4.5z"/><circle cx="7.5" cy="17" r="1.8"/><circle cx="16.5" cy="17" r="1.8"/><path d="M4.5 12h15"/></svg><span>Fahrzeug</span></button>
    <button data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8"/></svg><span>Einstellungen</span></button>
  </nav>

  <main id="view"></main>

  <button class="fab" id="fab" aria-label="Beleg aufnehmen"><span>＋</span></button>
</div>

<div id="sheetWrap" class="sheet-wrap hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast hidden"></div>

<input type="file" id="fileCamera" accept="image/*" capture="environment" hidden>
<input type="file" id="fileAny" accept="image/*,application/pdf" multiple hidden>
<input type="file" id="fileTemplate" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
<input type="file" id="fileBackup" accept=".zip,application/zip" hidden>

<script src="vendor/jszip.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="js/template.js"></script>
<script src="js/rb003.js"></script>
<script src="js/xlsxpdf.js"></script>
<script src="js/db.js"></script>
<script src="js/ocr.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
</body>
</html>
